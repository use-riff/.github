name: Feature request
description: Suggest an idea for riff.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        riff is still in research and development, so ideas are welcome. Please check the
        [roadmap](https://use-riff.github.io/#roadmap) and existing issues first.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Coin launches
        - Artist fee sharing and claims
        - Charity fallback
        - Website / docs
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who is affected (coin creators, artists, holders, charities) and why it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: extra
    attributes:
      label: Extra context
